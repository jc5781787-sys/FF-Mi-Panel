<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>FF MI PANEL</title>
<style>
* { box-sizing: border-box; }
body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
h1 { color: #ff2020; }
.panel {
  background: #191919;
  border: 2px solid #ff2020;
  border-radius: 18px;
  padding: 20px;
  margin: 20px auto;
  max-width: 400px;
}
button {
  background: #e00000;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 15px;
  width: 100%;
  margin: 9px 0;
  font-size: 16px;
  font-weight: bold;
}
.info {
  color: #aaa;
  font-size: 13px;
}
</style>
</head>
<body>

<h1>🔥 FF MI PANEL 🔥</h1>
<p>FREE FIRE CONFIGURATION</p>

<div class="panel">
<h2>CONTROL PRINCIPAL</h2>
<button onclick="activar()">ACTIVAR PANEL</button>
<p id="estado">Estado: Desactivado</p>
</div>

<div class="panel">
<h2>CONFIGURACIONES</h2>
<button onclick="mostrar('Sensibilidad')">SENSIBILIDAD</button>
<button onclick="mostrar('Controles de 4 dedos')">4 DEDOS</button>
<button onclick="mostrar('Configuración de pantalla')">PANTALLA 120 HZ</button>
<p id="resultado">Selecciona una configuración</p>
</div>

<p class="info">FF MI PANEL - VERSION 2.0</p>
<p class="info">Configuraciones informativas. Los cambios se realizan dentro del juego.</p>

<script>
function activar() {
  document.getElementById("estado").textContent =
  "Estado: Panel abierto";
}
function mostrar(nombre) {
  document.getElementById("resultado").textContent =
  "Configuración seleccionada: " + nombre;
}
</script>

</body>
</html>
