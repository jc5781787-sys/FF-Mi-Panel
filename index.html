<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF MI PANEL</title>
<style>
* {
  box-sizing: border-box;
}
body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 25px;
}
h1 {
  color: #ff2020;
  margin-top: 35px;
}
.panel {
  background: #191919;
  border: 2px solid #ff2020;
  border-radius: 15px;
  padding: 20px;
  margin: 25px auto;
  max-width: 380px;
  box-shadow: 0 0 15px #ff202055;
}
button {
  background: #e00000;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 15px;
  width: 100%;
  margin: 9px 0;
  font-size: 16px;
}
button:active {
  background: #990000;
}
</style>
</head>
<body>

<h1>🔥 FF MI PANEL 🔥</h1>
<p>Panel de configuración Free Fire</p>

<div class="panel">
<h2>Mi configuración</h2>

<button onclick="alert('Ajusta tu pantalla desde Free Fire')">
PANTALLA
</button>

<button onclick="alert('Configura tus controles dentro del juego')">
CONTROLES
</button>

<button onclick="alert('Ajusta tu sensibilidad dentro del juego')">
SENSIBILIDAD
</button>

</div>

<p>Panel informativo</p>
<p>Versión 1.0</p>

</body>
</html>
