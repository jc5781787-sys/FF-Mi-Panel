<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Mi Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial;text-align:center;padding:20px}
h1{color:#ff3030;font-size:30px}
p{color:#ccc}
.panel{max-width:430px;margin:auto}
.card{background:#191919;border:1px solid #ff3030;border-radius:14px;padding:18px;margin:15px 0}
button{width:100%;padding:16px;margin:8px 0;border:0;border-radius:10px;background:#e51d2a;color:white;font-size:17px;font-weight:bold}
.info{color:#fff;line-height:1.7}
.small{font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="panel">
<h1>🔥 FF MI PANEL 🔥</h1>
<p>Panel auxiliar de configuración</p>

<div class="card">
<h2 id="estado">Panel cerrado</h2>
<button onclick="activar()">ACTIVAR PANEL</button>
</div>

<div class="card">
<button onclick="mostrar('sensibilidad')">SENSIBILIDAD</button>
<button onclick="mostrar('dedos')">CONTROLES 4 DEDOS</button>
<button onclick="mostrar('pantalla')">PANTALLA 120 HZ</button>
<div id="resultado" class="info">Selecciona una configuración.</div>
</div>

<p class="small">Las opciones son recomendaciones. Debes aplicarlas manualmente dentro de Free Fire.</p>
</div>

<script>
function activar(){
document.getElementById("estado").innerText="🔥 PANEL ABIERTO 🔥";
}
function mostrar(opcion){
let texto="";
if(opcion==="sensibilidad"){
texto="<h3>SENSIBILIDAD RECOMENDADA</h3>General: 185<br> Punto rojo: 180<br> Mira 2X: 175<br> Mira 4X: 165<br> Mira francotirador: 90<br> Cámara: 150";
}
if(opcion==="dedos"){
texto="<h3>CONTROLES DE 4 DEDOS</h3>Índice izquierdo: disparo<br>Índice derecho: mira y apuntar<br>Pulgar izquierdo: movimiento<br>Pulgar derecho: cámara y saltar";
}
if(opcion==="pantalla"){
texto="<h3>PANTALLA 120 HZ</h3>Activa la frecuencia ProMotion en Ajustes de pantalla de tu iPhone. Dentro de Free Fire selecciona la mayor tasa de cuadros disponible.";
}
document.getElementById("resultado").innerHTML=texto;
}
</script>
</body>
</html>
